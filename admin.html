<!doctype html>
<html lang="en"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>CodingArena Admin Portal</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<style>
:root{--b:#2563eb;--v:#7c3aed;--g:#22c55e;--gd:#168243;--ink:#181c30;--muted:#687086;--bd:#e1e5ef;--grad:linear-gradient(135deg,#2563eb,#7c3aed 52%,#22c55e)}
body{margin:0;background:#f7f8fc;color:var(--ink);font-family:system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif}.side{position:fixed;inset:0 auto 0 0;width:250px;background:#fff;border-right:1px solid var(--bd);z-index:5;display:flex;flex-direction:column}.brand{background:var(--grad);color:#fff;padding:22px 18px}.brand h1{font-size:1.3rem;font-weight:800;margin:0}.brand small{opacity:.9}.menu{padding:12px;overflow:auto}.navbtn{width:100%;border:0;background:#fff;text-align:left;border-radius:12px;padding:12px 14px;margin:3px 0;font-weight:700;color:#465067}.navbtn:hover,.navbtn.active{background:#dcfce7;color:var(--gd)}.main{margin-left:250px;min-height:100vh}.top{height:72px;position:sticky;top:0;z-index:4;background:#fff;border-bottom:1px solid var(--bd);display:flex;align-items:center;justify-content:space-between;padding:0 25px}.title{font-size:1.25rem;font-weight:800}.badge-admin{background:#dcfce7;color:var(--gd);border-radius:999px;padding:7px 11px;font-size:.75rem;font-weight:800}.content{padding:24px;max-width:1500px;margin:auto}.cardx,.stat{background:#fff;border:1px solid var(--bd);border-radius:18px;box-shadow:0 5px 18px #1419320d;padding:20px}.stat{height:100%}.value{font-size:1.75rem;font-weight:900}.muted{color:var(--muted);font-size:.88rem}.grad{background:var(--grad);color:#fff;border:0;font-weight:800}.grad:hover{color:#fff}.status{border-radius:999px;padding:5px 9px;font-size:.7rem;font-weight:800}.live{background:#dcfce7;color:#166534}.up{background:#dbeafe;color:#1d4ed8}.end{background:#f1f5f9;color:#64748b}.table>:not(caption)>*>*{padding:12px 9px;vertical-align:middle}.mobile{display:none}
@media(max-width:900px){.side{width:78px}.brand{text-align:center;padding:18px 8px}.brand h1{font-size:1rem}.brand small,.label{display:none}.navbtn{text-align:center;padding:12px 5px;font-size:1.2rem}.main{margin-left:78px}}@media(max-width:600px){.side{display:none}.main{margin-left:0}.mobile{display:inline-flex}.content{padding:14px}.top{height:64px;padding:0 12px}}
</style></head><body>
<aside class="side"><div class="brand"><h1>⚡ CodingArena</h1><small>Admin Portal</small></div><div class="menu">
<button class="navbtn active" data-page="dashboard">📊 <span class="label">Dashboard</span></button>
<button class="navbtn" data-page="contests">🏆 <span class="label">Contests</span></button>
<button class="navbtn" data-page="problems">📝 <span class="label">Problems</span></button>
<button class="navbtn" data-page="submissions">📋 <span class="label">Submissions</span></button>
<button class="navbtn" data-page="users">👥 <span class="label">Users</span></button>
<button class="navbtn" data-page="community">💬 <span class="label">Community</span></button>
<button class="navbtn" data-page="announcements">📢 <span class="label">Announcements</span></button>
<button class="navbtn" data-page="settings">⚙️ <span class="label">Settings</span></button>
</div><div class="p-2 border-top"><button id="logout" class="navbtn">↪️ <span class="label">Logout</span></button></div></aside>
<main class="main"><header class="top"><div class="d-flex align-items-center gap-2"><button class="btn btn-light mobile" data-bs-toggle="offcanvas" data-bs-target="#mobile">☰</button><div id="title" class="title">Admin Dashboard</div></div><div class="d-flex gap-2 align-items-center"><span class="badge-admin">🛡 ADMIN</span><button id="view" class="btn btn-outline-secondary btn-sm">View App</button></div></header><div id="content" class="content"></div></main>
<div class="offcanvas offcanvas-start" id="mobile"><div class="offcanvas-header"><b>CodingArena</b><button class="btn-close" data-bs-dismiss="offcanvas"></button></div><div class="offcanvas-body" id="mobileBody"></div></div>
<div class="modal fade" id="modal"><div class="modal-dialog modal-lg"><div class="modal-content"><div class="modal-header"><b id="mtitle">Create</b><button class="btn-close" data-bs-dismiss="modal"></button></div><div id="mbody" class="modal-body"></div><div class="modal-footer"><button class="btn btn-light" data-bs-dismiss="modal">Cancel</button><button id="save" class="btn grad">Save</button></div></div></div></div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script>
const $=x=>document.getElementById(x),apiBase=localStorage.getItem('codingArenaApiBase')||'';let page='dashboard';
let contests=[{id:1,title:'Weekly Sprint',desc:'Fast problems • Rating challenge',status:'LIVE',problems:2,users:128},{id:2,title:'Code Masters',desc:'Algorithms • Data structures',status:'UPCOMING',problems:3,users:0}],problems=[{id:101,contest:1,title:'Two Sum',difficulty:'Easy',points:100,submissions:76},{id:102,contest:1,title:'Binary Search',difficulty:'Medium',points:150,submissions:51},{id:201,contest:2,title:'Graph Paths',difficulty:'Hard',points:200,submissions:0}],users=[{id:1,name:'admin',role:'ADMIN',rating:2000,status:'ACTIVE'},{id:2,name:'CodeMaster',role:'USER',rating:1842,status:'ACTIVE'},{id:3,name:'AlgoNinja',role:'USER',rating:1765,status:'ACTIVE'}],subs=[{id:9001,user:'CodeMaster',problem:'Two Sum',lang:'Java',verdict:'ACCEPTED',score:100},{id:9002,user:'AlgoNinja',problem:'Binary Search',lang:'C++',verdict:'WRONG_ANSWER',score:0}];
function esc(x){return String(x??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}function go(p){page=p;document.querySelectorAll('[data-page]').forEach(x=>x.classList.toggle('active',x.dataset.page===p));$('title').textContent={dashboard:'Admin Dashboard',contests:'Contest Management',problems:'Problem Management',submissions:'Submission Monitor',users:'User Management',community:'Community Management',announcements:'Announcements',settings:'Admin Settings'}[p];({dashboard,contestsPage,problemsPage,submissionsPage,usersPage,community,announcements,settings}[p]||dashboard)();}
function stat(i,n,v,s){return `<div class="col-6 col-xl-3"><div class="stat"><div class="fs-4">${i}</div><div class="muted">${n}</div><div class="value">${v}</div><div class="muted">${s}</div></div></div>`}function panel(h,b){return `<div class="cardx"><div class="d-flex justify-content-between align-items-center mb-3"><h2 class="h6 fw-bold m-0">${h}</h2>${b||''}</div>`}
function dashboard(){$('content').innerHTML=`<div class="row g-3 mb-4">${stat('👥','Total Users','1,248','+12% this month')}${stat('🏆','Contests','24','3 active/upcoming')}${stat('📝','Problems','186','14 added this month')}${stat('📋','Submissions','18,492','98.7% judge success')}</div><div class="row g-4"><div class="col-lg-8">${panel('🏆 Active & Upcoming',`<button class="btn grad btn-sm" onclick="contestForm()">+ Contest</button>`)}${contests.map(c=>`<div class="p-3 border rounded-4 mb-2 d-flex justify-content-between gap-2 flex-wrap"><div><b>${esc(c.title)}</b><div class="muted">${esc(c.desc)} • ${c.problems} problems • ${c.users} participants</div></div><span class="status ${c.status==='LIVE'?'live':'up'}">${c.status}</span></div>`).join('')}</div></div><div class="col-lg-4">${panel('⚡ Judge Status')}${['Queue|3','Running|7','Workers|4 / 4','Success|98.7%'].map(x=>{let a=x.split('|');return `<div class="d-flex justify-content-between py-2 border-bottom"><span>${a[0]}</span><b>${a[1]}</b></div>`}).join('')}</div></div></div><div class="row g-4 mt-1"><div class="col-lg-8">${panel('📋 Recent Submissions')}<div class="table-responsive">${subTable(subs)}</div></div><div class="col-lg-4">${panel('🛠 Quick Actions')}${['Create Contest','Create Problem','Review Submissions','Manage Users'].map((x,i)=>`<button class="btn btn-outline-secondary w-100 mb-2" onclick="${['contestForm()','problemForm()','go(\'submissions\')','go(\'users\')'][i]}">${['🏆','📝','📋','👥'][i]} ${x}</button>`).join('')}</div></div>`}
function contestsPage(){$('content').innerHTML=panel('🏆 Contests',`<button class="btn grad" onclick="contestForm()">+ Create Contest</button>`)+`<div class="table-responsive"><table class="table"><thead><tr><th>ID</th><th>Contest</th><th>Status</th><th>Problems</th><th>Users</th><th>Actions</th></tr></thead><tbody>${contests.map(c=>`<tr><td>${c.id}</td><td><b>${esc(c.title)}</b><div class="muted">${esc(c.desc)}</div></td><td><span class="status ${c.status==='LIVE'?'live':'up'}">${c.status}</span></td><td>${c.problems}</td><td>${c.users}</td><td><button class="btn btn-sm btn-outline-secondary" onclick="contestForm(${c.id})">Edit</button> <button class="btn btn-sm btn-outline-danger" onclick="delContest(${c.id})">Delete</button></td></tr>`).join('')}</tbody></table></div></div>`}
function problemsPage(){$('content').innerHTML=panel('📝 Problems',`<button class="btn grad" onclick="problemForm()">+ Create Problem</button>`)+`<div class="table-responsive"><table class="table"><thead><tr><th>ID</th><th>Problem</th><th>Contest</th><th>Difficulty</th><th>Points</th><th>Submissions</th><th></th></tr></thead><tbody>${problems.map(p=>`<tr><td>${p.id}</td><td><b>${esc(p.title)}</b></td><td>#${p.contest}</td><td>${p.difficulty}</td><td>${p.points}</td><td>${p.submissions}</td><td><button class="btn btn-sm btn-outline-secondary" onclick="problemForm(${p.id})">Edit</button> <button class="btn btn-sm btn-outline-danger" onclick="delProblem(${p.id})">Delete</button></td></tr>`).join('')}</tbody></table></div></div>`}
function subTable(a){return `<table class="table"><thead><tr><th>ID</th><th>User</th><th>Problem</th><th>Language</th><th>Verdict</th><th>Score</th></tr></thead><tbody>${a.map(s=>`<tr><td>#${s.id}</td><td>${esc(s.user)}</td><td>${esc(s.problem)}</td><td>${s.lang}</td><td><span class="status ${s.verdict==='ACCEPTED'?'live':'end'}">${s.verdict}</span></td><td>${s.score}</td></tr>`).join('')}</tbody></table>`}function submissionsPage(){$('content').innerHTML=panel('📋 Submission Monitor',`<button class="btn btn-outline-secondary btn-sm" onclick="go('submissions')">Refresh</button>`)+subTable(subs)+'</div>'}function usersPage(){$('content').innerHTML=panel('👥 Users')+`<div class="table-responsive"><table class="table"><thead><tr><th>ID</th><th>User</th><th>Role</th><th>Rating</th><th>Status</th><th></th></tr></thead><tbody>${users.map(u=>`<tr><td>${u.id}</td><td><b>${esc(u.name)}</b></td><td>${u.role}</td><td>${u.rating}</td><td>${u.status}</td><td><button class="btn btn-sm btn-outline-secondary" onclick="toggleUser(${u.id})">${u.status==='ACTIVE'?'Suspend':'Activate'}</button></td></tr>`).join('')}</tbody></table></div></div>`}
function community(){$('content').innerHTML=panel('💬 Community Moderation')+['How to approach Two Sum efficiently?','Best way to learn Dynamic Programming?','Java vs C++ for competitive programming','Tips for improving contest speed'].map(x=>`<div class="p-3 border rounded-4 mb-2 d-flex justify-content-between"><span><b>${x}</b><div class="muted">Community discussion</div></span><button class="btn btn-sm btn-outline-danger" onclick="alert('Discussion hidden')">Hide</button></div>`).join('')+'</div>'}function announcements(){$('content').innerHTML=panel('📢 Announcements',`<button class="btn grad" onclick="announceForm()">+ Announcement</button>`)+`<div class="p-3 border rounded-4 mb-2"><b>New Weekly Contest</b><div class="muted">Published to all users</div></div><div class="p-3 border rounded-4"><b>CodingArena Update</b><div class="muted">Published to all users</div></div></div>`}function settings(){$('content').innerHTML=panel('⚙️ Backend Settings')+`<label class="form-label">Spring Boot API Base URL</label><input id="api" class="form-control mb-3" value="${esc(apiBase)}" placeholder="https://api.example.com"><button class="btn grad" onclick="localStorage.setItem('codingArenaApiBase',$('api').value.replace(/\/$/,''));alert('Saved')">Save</button><hr><p class="muted mb-0">Production admin actions must be protected by Spring Security/JWT/session authentication on the backend.</p></div>`}
function modal(title,html,save){$('mtitle').textContent=title;$('mbody').innerHTML=html;$('save').onclick=save;bootstrap.Modal.getOrCreateInstance($('modal')).show()}
function contestForm(id){let c=contests.find(x=>x.id===id);modal(c?'Edit Contest':'Create Contest',`<input id="ct" class="form-control mb-3" placeholder="Contest title" value="${c?esc(c.title):''}"><textarea id="cd" class="form-control" rows="4" placeholder="Description">${c?esc(c.desc):''}</textarea>`,()=>{let t=$('ct').value.trim();if(!t)return alert('Title required');if(c){c.title=t;c.desc=$('cd').value}else contests.push({id:Math.max(...contests.map(x=>x.id))+1,title:t,desc:$('cd').value,status:'UPCOMING',problems:0,users:0});bootstrap.Modal.getInstance($('modal')).hide();go('contests')})}function delContest(id){if(confirm('Delete contest?')){contests=contests.filter(x=>x.id!==id);problems=problems.filter(x=>x.contest!==id);go('contests')}}
function problemForm(id){let p=problems.find(x=>x.id===id);modal(p?'Edit Problem':'Create Problem',`<select id="pc" class="form-select mb-3">${contests.map(c=>`<option value="${c.id}" ${p&&p.contest===c.id?'selected':''}>#${c.id} ${esc(c.title)}</option>`).join('')}</select><input id="pt" class="form-control mb-3" placeholder="Problem title" value="${p?esc(p.title):''}"><div class="row g-2"><div class="col-6"><select id="pd" class="form-select"><option>Easy</option><option>Medium</option><option>Hard</option></select></div><div class="col-6"><input id="pp" type="number" class="form-control" value="${p?p.points:100}"></div></div>`,()=>{let t=$('pt').value.trim();if(!t)return alert('Title required');if(p){Object.assign(p,{contest:+$('pc').value,title:t,difficulty:$('pd').value,points:+$('pp').value})}else problems.push({id:Math.max(...problems.map(x=>x.id),100)+1,contest:+$('pc').value,title:t,difficulty:$('pd').value,points:+$('pp').value,submissions:0});bootstrap.Modal.getInstance($('modal')).hide();go('problems')})}function delProblem(id){if(confirm('Delete problem?')){problems=problems.filter(x=>x.id!==id);go('problems')}}function toggleUser(id){let u=users.find(x=>x.id===id);u.status=u.status==='ACTIVE'?'SUSPENDED':'ACTIVE';go('users')}function announceForm(){modal('New Announcement','<input id="at" class="form-control mb-3" placeholder="Title"><textarea id="ab" class="form-control" rows="6" placeholder="Message"></textarea>',()=>{if(!$('at').value.trim())return alert('Title required');bootstrap.Modal.getInstance($('modal')).hide();alert('Announcement published')})}
document.querySelectorAll('[data-page]').forEach(b=>b.onclick=()=>go(b.dataset.page));$('view').onclick=()=>location.href='index.html';$('logout').onclick=()=>location.href='index.html';go('dashboard');
</script></body></html>
