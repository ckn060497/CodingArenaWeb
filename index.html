<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#5b21b6">
  <title>CodingArena Web</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="css/style.css" rel="stylesheet">
</head>
<body>
  <div id="app">
    <header class="topbar">
      <div class="container-fluid px-2 px-md-4">
        <div class="d-flex align-items-center gap-2 topbar-inner">
          <button id="backBtn" class="icon-btn" aria-label="Back">‹</button>
          <div class="brand-wrap flex-grow-1">
            <div id="pageTitle" class="page-title">CodingArena</div>
            <div id="pageSubtitle" class="page-subtitle d-none d-md-block">Practice • Compete • Climb</div>
          </div>
          <div id="timer" class="timer d-none"></div>
          <button id="menuBtn" class="icon-btn" aria-label="Menu">☰</button>
        </div>
      </div>
    </header>

    <main class="main-shell">
      <div id="content" class="container-fluid page-content"></div>
    </main>

    <nav class="bottom-nav">
      <button data-route="home" class="nav-item active"><span>⌂</span><small>Home</small></button>
      <button data-route="contests" class="nav-item"><span>🏆</span><small>Contests</small></button>
      <button data-route="leaderboard" class="nav-item"><span>🥇</span><small>Rank</small></button>
      <button data-route="profile" class="nav-item"><span>👤</span><small>Profile</small></button>
    </nav>
  </div>

  <div class="modal fade" id="menuModal" tabindex="-1" aria-hidden="true">
    <div class="modal-dialog modal-dialog-end">
      <div class="modal-content menu-card">
        <div class="modal-header">
          <h5 class="modal-title">CodingArena</h5>
          <button class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
        </div>
        <div id="menuItems" class="list-group list-group-flush"></div>
      </div>
    </div>
  </div>

  <div class="toast-container position-fixed top-0 end-0 p-3">
    <div id="toast" class="toast" role="alert">
      <div class="toast-body" id="toastBody"></div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
